<style>
/* Layout: barra de puestos fija arriba, contenido en una columna ancha; tablas con scroll propio */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111816;--card:#1a2321;--ink:#e5ecea;--mut:#98a8a4;--line:#2c3936;--acc:#4cc2b6;--accfg:#06201d;--r:#ff8a80;--o:#ffb04d;--g:#6fd39b;--y:#ffd54f;--soft:#20302c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111816;--card:#1a2321;--ink:#e5ecea;--mut:#98a8a4;--line:#2c3936;--acc:#4cc2b6;--accfg:#06201d;--r:#ff8a80;--o:#ffb04d;--g:#6fd39b;--y:#ffd54f;--soft:#20302c;color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px 6px}
.hd h1{font:800 20px/1.1 var(--f-d);margin:0;letter-spacing:-.01em}

.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 10px}
.fm .w2{grid-column:span 2}@media(max-width:520px){.fm .w2{grid-column:auto}}

.bars div{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);min-width:0}
.bars .cl{display:flex;gap:2px;align-items:flex-end;width:100%;justify-content:center;height:130px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32.5px;background-position:0 0}
.bars i{display:block;width:45%;max-width:22px;border-radius:3px 3px 0 0;min-height:1px;background:var(--acc)}
.bars i.t{background:var(--soft);outline:1px solid var(--line)}
.bars em{font:600 10px var(--f-m);color:var(--ink);font-style:normal;height:16px;white-space:nowrap}
.bars u{text-decoration:none;padding:4px 0 6px;font-family:var(--f-m)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px}@media(min-width:960px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--g)}.ko{color:var(--r)}.wa{color:var(--o)}.mu{color:var(--mut)}
.lin{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lin span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.lin b{font-family:var(--f-m);font-weight:500}
a.wl{color:var(--g);font-weight:700;white-space:nowrap}
.sy{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.sy b{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block}
.sy.old b{background:var(--o)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--mut);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header><div class="wrap"><div class="hd"><div><h1>Centro de Operaciones</h1><small id="sub">Mobalpa · Málaga</small></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="sy" id="sync"><b></b>Cargando instalaciones…</span><a class="ap" href="https://claude.ai/artifact/PWZqEmZ6VM4YnzoKf69Q7b" target="_blank" rel="noopener">Abrir gestión de instalaciones ↗</a></div></div><nav id="nav"></nav></div></header>
<main class="wrap" id="app"><div class="empty">Cargando datos del centro de operaciones…</div></main>

<script>
(function(){
var APP='https://claude.ai/artifact/PWZqEmZ6VM4YnzoKf69Q7b';
var COLS=['conf','fact','rec','wa','lin','ven'];
var P={d:{conf:[],fact:[],rec:[],wa:[],lin:[],ven:[]},sync:null,db:null,ro:false,msg:{},arm:{}};
var TABS=[['gerencia','Gerencia'],['administracion','1 · Administración'],['instalaciones','2 · Instalaciones y entregas'],['whatsapp','3 · WhatsApp clientes']];
function tab(){var h=(location.hash||'').slice(1);return TABS.some(function(t){return t[0]===h})?h:'gerencia'}
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function F(d){return d?String(d).split('-').reverse().join('/'):'—'}
function iso(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoy(){return iso(new Date())}
function lun(off){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7+7*(off||0));return d}
function rng(off){var a=lun(off),b=new Date(a);b.setDate(b.getDate()+6);return[iso(a),iso(b)]}
function dif(d){return Math.round((new Date(d+'T00:00:00')-new Date(hoy()+'T00:00:00'))/864e5)}
function eur(n){return(Number(n)||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
function N(v){var t=String(v==null?'':v).replace(/[€\s]/g,'');if(t.indexOf(',')>=0)t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');var n=parseFloat(t);return isNaN(n)?0:n}
function U(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function obras(){return(P.sync&&P.sync.obras)||[]}
function nm(o){return(o.ar?'Ar '+o.ar+' · ':'')+(o.cli||'Sin nombre')}
function rcv(o){var it=o.items||[];return[it.filter(function(i){return i.e==='Recibido'||i.e==='Recogido'}).length,it.length]}
function conf(id){return P.d.conf.find(function(c){return c.id===id})||{}}
function lsGet(){try{var L=JSON.parse(localStorage.getItem('cop_v1'));if(L)Object.keys(P.d).forEach(function(k){if(L[k])P.d[k]=L[k]})}catch(e){}}
function lsPut(){try{localStorage.setItem('cop_v1',JSON.stringify(P.d))}catch(e){}}
lsGet();

function put(c,o){var a=P.d[c],i=a.findIndex(function(x){return x.id===o.id});if(i<0)a.push(o);else a[i]=o;lsPut();
 if(P.db)P.db.doc(c+'/'+o.id).set(JSON.parse(JSON.stringify(o))).catch(function(e){note('No se pudo guardar en la nube ('+(e&&(e.code||e.message)||e)+'). Queda guardado en este dispositivo.')});draw()}
function del(c,id){P.d[c]=P.d[c].filter(function(x){return x.id!==id});lsPut();if(P.db)P.db.doc(c+'/'+id).delete().catch(function(){});draw()}
function note(t){var s=document.getElementById('sub');if(s){s.textContent=t;s.style.color='var(--r)'}}

/* ---------- ALERTAS ---------- */
function alertas(){var A=[],t=hoy();
obras().forEach(function(o){var ds=o.ins||[],last=ds[ds.length-1],rr=rcv(o),cf=conf(o.id);
 if(last&&last<t&&o.fin!=='EN SU TOTALIDAD')A.push({u:'u0',t:o.fin==='A FALTA DE REMATES'?'Remates pendientes':'Instalación sin cerrar',x:nm(o)+' · instalación '+F(last)+(o.fin?'':' · sin marcar «Cocina finaliza»'),app:1});
 var nx=ds.filter(function(d){return d>=t})[0];
 if(nx&&dif(nx)<=7){var pp=(o.items||[]).filter(function(i){return i.e==='Por pedir'}).length;
  if(pp)A.push({u:'u0',t:'Material sin pedir',x:nm(o)+' · '+pp+' artículo(s) por pedir · instala '+F(nx),app:1});
  if(rr[1]&&rr[0]<rr[1])A.push({u:'u1',t:'Material no recibido',x:nm(o)+' · '+rr[0]+'/'+rr[1]+' recibido · instala '+F(nx),app:1});
  if(!o.pago)A.push({u:'u1',t:'Pagos incompletos',x:nm(o)+' · instala '+F(nx),app:1})}
 var vivo=o.fin!=='EN SU TOTALIDAD';
 if(vivo&&o.rec&&o.rec<t&&dif(o.rec)>=-21&&!cf.rec)A.push({u:'u1',t:'Recepción de cocina sin confirmar',x:nm(o)+' · prevista '+F(o.rec),k:'rec',o:o.id});
 if(vivo&&o.ent&&o.ent<t&&dif(o.ent)>=-21&&!cf.ent)A.push({u:'u1',t:'Entrega al cliente sin confirmar',x:nm(o)+' · prevista '+F(o.ent),k:'ent',o:o.id})});
P.d.fact.forEach(function(f){if(f.est!=='Pagada'&&f.venc&&f.venc<t)A.push({u:'u0',t:'Factura vencida',x:(f.prov||'')+' nº '+(f.num||'—')+' · '+eur(f.imp)+' · vencía '+F(f.venc),tab:'administracion'})});
P.d.rec.forEach(function(r){if(r.est==='Incidencia')A.push({u:'u1',t:'Incidencia en recepción de mercancía',x:(r.prov||'')+' · albarán '+(r.alb||'—')+(r.ar?' · Ar '+r.ar:'')+(r.inc?' · '+r.inc:''),tab:'administracion'})});
P.d.wa.forEach(function(w){if(w.est!=='Respondido'){var h=(Date.now()-(w.ts||Date.now()))/36e5;if(h>=4)A.push({u:h>=24?'u0':'u1',t:'WhatsApp sin responder',x:(w.cli||w.tel||'')+' · hace '+Math.floor(h)+' h · línea '+(w.lin||'—'),tab:'whatsapp'})}});
P.d.ven.forEach(function(v){if(v.est==='Abierto'&&v.fCompra&&v.fCompra<t)A.push({u:'u2',t:'Presupuesto sin seguimiento',x:(v.cli||'')+' · '+eur(v.imp)+' · compra prevista '+F(v.fCompra),tab:'gerencia'})});
var ord={u0:0,u1:1,u2:2};A.sort(function(a,b){return ord[a.u]-ord[b.u]});return A}
function alHtml(A){if(!A.length)return'<div class="empty">Sin alertas: todo lo planificado está ejecutado.</div>';
return'<ul class="al">'+A.map(function(a){return'<li class="'+a.u+'"><div><b>'+E(a.t)+'</b><small>'+E(a.x)+'</small></div><span style="display:flex;gap:6px">'+
(a.k?'<button class="sm" data-act="ok" data-o="'+a.o+'" data-k="'+a.k+'">Confirmar hecho</button>':'')+
(a.app?'<a class="ap" style="padding:4px 10px;font-size:12px" href="'+APP+'" target="_blank" rel="noopener">Ver en app ↗</a>':a.tab&&a.tab!==tab()?'<a class="ap" style="padding:4px 10px;font-size:12px" href="#'+a.tab+'">Ir al puesto</a>':'')+'</span></li>'}).join('')+'</ul>'}

/* ---------- INSTALACIONES SEMANA ---------- */
var WD=['dom','lun','mar','mié','jue','vie','sáb'];
function instSemana(off){var r=rng(off),L=[];obras().forEach(function(o){(o.ins||[]).forEach(function(d){if(d>=r[0]&&d<=r[1])L.push({d:d,o:o})})});L.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
var h='<h2>'+(off?'Instalaciones semana próxima':'Instalaciones esta semana')+' <span>'+F(r[0])+' – '+F(r[1])+' · '+L.length+' jornada(s)</span></h2>';
if(!L.length)return h+'<div class="empty">Sin instalaciones programadas.</div>';
return h+'<div class="tw"><table><tr><th>Día</th><th>Obra</th><th>Instalador</th><th class="n">Material</th><th>Pagos</th><th>Estado</th></tr>'+L.map(function(x){var o=x.o,rr=rcv(o),done=o.fin==='EN SU TOTALIDAD';
return'<tr><td>'+WD[new Date(x.d+'T00:00:00').getDay()]+' '+F(x.d).slice(0,5)+'</td><td>'+E(nm(o))+'</td><td>'+E(o.inst)+'</td><td class="n '+(rr[1]&&rr[0]<rr[1]?'wa':'ok')+'">'+rr[0]+'/'+rr[1]+'</td><td><span class="pill '+(o.pago?'ok">Completos':'ko">Pendientes')+'</span></td><td>'+(done?'<span class="pill ok">Finalizada</span>':o.fin?'<span class="pill ko">Remates</span>':x.d<hoy()?'<span class="pill ko">Sin cerrar</span>':'<span class="pill mu">Programada</span>')+'</td></tr>'}).join('')+'</table></div>'}

/* ---------- VENTAS ---------- */
function opts(l,v){return l.map(function(s){return'<option'+(s===v?' selected':'')+'>'+s+'</option>'}).join('')}
function ventas(){var V=P.d.ven,t=hoy(),w0=rng(0),m0=t.slice(0,7);
var ab=V.filter(function(v){return v.est==='Abierto'}),ent=V.filter(function(v){return v.fVis>=w0[0]&&v.fVis<=w0[1]});
var gan=V.filter(function(v){return v.est==='Ganado'&&(v.fCierre||'').slice(0,7)===m0}),cer=V.filter(function(v){return v.est!=='Abierto'}),gn=cer.filter(function(v){return v.est==='Ganado'}).length;
var pond=function(v){return N(v.imp)*N(v.prob)/100},sum=function(l,f){return l.reduce(function(a,v){return a+(f?f(v):N(v.imp))},0)};
var wk=[];for(var i=0;i<8;i++){var r=rng(i),s=ab.filter(function(v){return v.fCompra>=r[0]&&v.fCompra<=r[1]});wk.push({l:F(r[0]).slice(0,5),t:sum(s),p:sum(s,pond),n:s.length})}
var mx=Math.max.apply(null,wk.map(function(w){return w.t}).concat([1]));
return'<h2>Previsión de ventas <span>presupuestos de clientes que entran en tienda</span></h2><div class="kp">'+
'<div><b>'+eur(sum(ent))+'</b><span>Presupuestos entrados esta semana ('+ent.length+')</span></div>'+
'<div><b>'+eur(sum(ab))+'</b><span>Cartera abierta ('+ab.length+')</span></div>'+
'<div><b>'+eur(sum(ab,pond))+'</b><span>Cartera ponderada por probabilidad</span></div>'+
'<div><b>'+eur(sum(gan))+'</b><span>Vendido este mes ('+gan.length+')</span></div>'+
'<div><b>'+(cer.length?Math.round(gn*100/cer.length)+' %':'—')+'</b><span>Tasa de cierre</span></div></div>'+
'<p class="mut">Cierre previsto por semana, próximas 8 semanas. Barra clara: importe total · barra oscura: importe ponderado (cifra superior).</p><div class="bars">'+wk.map(function(w){return'<div title="'+w.n+' presupuesto(s) · total '+eur(w.t)+'"><em>'+(w.t?eur(w.p):'')+'</em><span class="cl"><i class="t" style="height:'+Math.round(w.t*130/mx)+'px"></i><i style="height:'+Math.round(w.p*130/mx)+'px"></i></span><u>'+w.l+'</u></div>'}).join('')+'</div>'+
'<h2>Registrar presupuesto</h2><form class="fm" data-form="ven"><div><label for="v_cli">Cliente</label><input id="v_cli" name="cli" required></div><div><label for="v_tel">Teléfono</label><input id="v_tel" name="tel" inputmode="tel"></div><div><label for="v_imp">Importe (€)</label><input id="v_imp" name="imp" inputmode="decimal" required placeholder="12.500"></div><div><label for="v_vis">Fecha visita</label><input id="v_vis" name="fVis" type="date" value="'+t+'"></div><div><label for="v_com">Compra prevista</label><input id="v_com" name="fCompra" type="date"></div><div><label for="v_pro">Probabilidad</label><select id="v_pro" name="prob">'+opts(['25','50','75','90'],'50')+'</select></div><div><label for="v_ven">Vendedor</label><input id="v_ven" name="ven"></div><div><button class="p" type="submit">Añadir</button></div><div class="msg">'+E(P.msg.ven||'')+'</div></form>'+
(V.length?'<div class="tw"><table><tr><th>Cliente</th><th>Visita</th><th>Compra prevista</th><th class="n">Importe</th><th class="n">Prob.</th><th>Vendedor</th><th>Estado</th><th></th></tr>'+
V.slice().sort(function(a,b){return(a.est==='Abierto'?0:1)-(b.est==='Abierto'?0:1)||String(a.fCompra||'9').localeCompare(String(b.fCompra||'9'))}).map(function(v){return'<tr><td>'+E(v.cli)+(v.tel?'<br><span class="mut">'+E(v.tel)+'</span>':'')+'</td><td>'+F(v.fVis)+'</td><td class="'+(v.est==='Abierto'&&v.fCompra&&v.fCompra<t?'ko':'')+'">'+F(v.fCompra)+'</td><td class="n">'+eur(v.imp)+'</td><td class="n">'+E(v.prob)+' %</td><td>'+E(v.ven||'')+'</td><td><select class="sm" data-st="ven" data-id="'+v.id+'" aria-label="Estado">'+opts(['Abierto','Ganado','Perdido'],v.est)+'</select></td><td>'+delBtn('ven',v.id)+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Aún no hay presupuestos. Registra el primero con el formulario de arriba.</div>')}
function delBtn(c,id){var k=c+id;return'<button class="sm x" data-act="del" data-c="'+c+'" data-id="'+id+'">'+(P.arm[k]?'¿Seguro?':'Eliminar')+'</button>'}

/* ---------- ADMINISTRACIÓN ---------- */
function adm(){var t=hoy(),Fc=P.d.fact,pend=Fc.filter(function(f){return f.est!=='Pagada'});
var tr=[];obras().forEach(function(o){if(o.fin==='EN SU TOTALIDAD')return;(o.items||[]).forEach(function(i){if(i.e==='Pedido'||i.e==='En tránsito')tr.push({o:o,i:i})})});
return'<div class="kp"><div><b>'+eur(pend.reduce(function(a,f){return a+N(f.imp)},0))+'</b><span>Facturas pendientes de pago ('+pend.length+')</span></div><div><b class="ko">'+pend.filter(function(f){return f.venc&&f.venc<t}).length+'</b><span>Vencidas</span></div><div><b>'+pend.filter(function(f){return f.venc&&f.venc>=t&&dif(f.venc)<=7}).length+'</b><span>Vencen en 7 días</span></div><div><b>'+tr.length+'</b><span>Artículos pedidos o en tránsito</span></div><div><b class="'+(P.d.rec.some(function(r){return r.est==='Incidencia'})?'ko':'')+'">'+P.d.rec.filter(function(r){return r.est==='Incidencia'}).length+'</b><span>Incidencias de recepción abiertas</span></div></div>'+
'<div class="two"><div><h2>Facturación de proveedores</h2><form class="fm" data-form="fact"><div><label for="f_prov">Proveedor</label><input id="f_prov" name="prov" required></div><div><label for="f_num">Nº factura</label><input id="f_num" name="num"></div><div><label for="f_fec">Fecha factura</label><input id="f_fec" name="fec" type="date" value="'+t+'"></div><div><label for="f_ven">Vencimiento</label><input id="f_ven" name="venc" type="date"></div><div><label for="f_imp">Importe (€)</label><input id="f_imp" name="imp" inputmode="decimal" required></div><div><label for="f_ar">Obra (Ar)</label><input id="f_ar" name="ar"></div><div><button class="p" type="submit">Añadir factura</button></div><div class="msg">'+E(P.msg.fact||'')+'</div></form>'+
(Fc.length?'<div class="tw"><table><tr><th>Proveedor</th><th>Nº</th><th>Vence</th><th class="n">Importe</th><th>Ar</th><th>Estado</th><th></th></tr>'+Fc.slice().sort(function(a,b){return(a.est==='Pagada')-(b.est==='Pagada')||String(a.venc||'9').localeCompare(String(b.venc||'9'))}).map(function(f){return'<tr><td>'+E(f.prov)+'</td><td>'+E(f.num)+'</td><td class="'+(f.est!=='Pagada'&&f.venc&&f.venc<t?'ko':'')+'">'+F(f.venc)+'</td><td class="n">'+eur(f.imp)+'</td><td>'+E(f.ar||'')+'</td><td><select class="sm" data-st="fact" data-id="'+f.id+'" aria-label="Estado">'+opts(['Pendiente','Pagada'],f.est)+'</select></td><td>'+delBtn('fact',f.id)+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Sin facturas registradas.</div>')+'</div>'+
'<div><h2>Recepción de mercancía</h2><form class="fm" data-form="rec"><div><label for="r_prov">Proveedor</label><input id="r_prov" name="prov" required></div><div><label for="r_alb">Nº albarán</label><input id="r_alb" name="alb"></div><div><label for="r_fec">Fecha</label><input id="r_fec" name="fec" type="date" value="'+t+'"></div><div><label for="r_ar">Obra (Ar)</label><input id="r_ar" name="ar"></div><div><label for="r_bul">Bultos</label><input id="r_bul" name="bul" inputmode="numeric"></div><div><label for="r_est">Estado</label><select id="r_est" name="est">'+opts(['Correcto','Incidencia'],'Correcto')+'</select></div><div class="w2"><label for="r_inc">Incidencia / observaciones</label><input id="r_inc" name="inc" placeholder="Golpe en caja, falta bulto…"></div><div><button class="p" type="submit">Registrar entrada</button></div><div class="msg">'+E(P.msg.rec||'')+'</div></form>'+
(P.d.rec.length?'<div class="tw"><table><tr><th>Fecha</th><th>Proveedor</th><th>Albarán</th><th>Ar</th><th>Estado</th><th></th></tr>'+P.d.rec.slice().sort(function(a,b){return String(b.fec).localeCompare(String(a.fec))}).map(function(r){return'<tr><td>'+F(r.fec)+'</td><td>'+E(r.prov)+'</td><td>'+E(r.alb)+(r.bul?' · '+E(r.bul)+' b.':'')+'</td><td>'+E(r.ar||'')+'</td><td><select class="sm" data-st="rec" data-id="'+r.id+'" aria-label="Estado">'+opts(['Correcto','Incidencia','Resuelta'],r.est)+'</select>'+(r.inc?'<br><span class="mut">'+E(r.inc)+'</span>':'')+'</td><td>'+delBtn('rec',r.id)+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Sin entradas registradas.</div>')+'</div></div>'+
'<h2>Pendiente de recibir según las obras <span>para marcarlo como recibido, hazlo en la app de instalaciones</span></h2>'+(tr.length?'<div class="tw"><table><tr><th>Obra</th><th>Artículo</th><th>Proveedor</th><th>Estado</th></tr>'+tr.map(function(x){return'<tr><td>'+E(nm(x.o))+'</td><td>'+E(x.i.n)+'</td><td>'+E(x.i.p||'')+'</td><td><span class="pill wa">'+E(x.i.e)+'</span></td></tr>'}).join('')+'</table></div>':'<div class="empty">Nada pedido ni en tránsito.</div>')}

/* ---------- INSTALACIONES Y ENTREGAS ---------- */
function ins(){var t=hoy(),desde=rng(-1)[0],lim=rng(3)[1],ev=[];obras().forEach(function(o){var cf=conf(o.id);
 if(o.rec)ev.push({d:o.rec,k:'Recepción de cocina',o:o,ok:cf.rec,kk:'rec'});
 if(o.tr)ev.push({d:o.tr,k:'Transporte '+(o.ag||''),o:o});
 if(o.ent)ev.push({d:o.ent,k:'Entrega al cliente',o:o,ok:cf.ent,kk:'ent'});
 (o.ins||[]).forEach(function(d){ev.push({d:d,k:'Instalación · '+o.inst,o:o,ok:o.fin==='EN SU TOTALIDAD'})})});
ev=ev.filter(function(e){return e.d>=desde&&e.d<=lim}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
return instSemana(0)+instSemana(1)+'<h2>Agenda de recepciones, transportes, entregas e instalaciones <span>semana pasada → 4 semanas</span></h2>'+(ev.length?'<div class="tw"><table><tr><th>Fecha</th><th>Tipo</th><th>Obra</th><th>Teléfono</th><th>Dirección</th><th>Estado</th></tr>'+ev.map(function(e){
var st=e.ok?'<span class="pill ok">Hecho '+(typeof e.ok==='string'?F(e.ok).slice(0,5):'')+'</span>':(e.kk&&e.d<=t)?'<button class="sm" data-act="ok" data-o="'+e.o.id+'" data-k="'+e.kk+'">Confirmar hecho</button>':e.d<t?'<span class="pill ko">Sin cerrar</span>':'<span class="pill mu">Previsto</span>';
return'<tr><td>'+WD[new Date(e.d+'T00:00:00').getDay()]+' '+F(e.d).slice(0,5)+'</td><td>'+E(e.k)+'</td><td>'+E(nm(e.o))+'</td><td style="font-family:var(--f-m)">'+E(e.o.tel||'')+'</td><td>'+E(e.o.dir||'')+'</td><td>'+st+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Sin eventos en este periodo.</div>')}

/* ---------- WHATSAPP ---------- */
var TPL=[['Mensaje en blanco',''],['Confirmar instalación','Hola {n}, le confirmamos la instalación de su cocina el {f}. Quedamos a su disposición. Mobalpa.'],['Material recibido','Hola {n}, ya hemos recibido el material de su cocina. Le llamaremos para coordinar la entrega. Mobalpa.'],['Recordatorio de pago','Hola {n}, le recordamos que queda pendiente el pago correspondiente a su pedido. Gracias. Mobalpa.'],['Seguimiento de presupuesto','Hola {n}, ¿ha podido revisar el presupuesto de su cocina? Si quiere ajustar algo, estamos a su disposición. Mobalpa.']];
function waNum(t){t=String(t||'').replace(/\D/g,'');if(t.length===9)t='34'+t;return t}
function waHref(w,i){var n=waNum(w.tel);if(!n)return'';var tel=String(w.tel).replace(/\D/g,'').slice(-9),o=obras().find(function(o){return tel&&String(o.tel||'').replace(/\D/g,'').slice(-9)===tel}),f=o?((o.ins||[]).filter(function(d){return d>=hoy()})[0]||''):'';
var txt=TPL[i][1].replace('{n}',String(w.cli||'').split(' ')[0]).replace('{f}',f?F(f):'(fecha por confirmar)');return'https://wa.me/'+n+(txt?'?text='+encodeURIComponent(txt):'')}
function wa(){var L=P.d.lin,W=P.d.wa,pe=W.filter(function(w){return w.est!=='Respondido'});
return'<h2>Líneas de WhatsApp de la empresa</h2><div class="lin">'+(L.length?L.map(function(l){return'<span>'+E(l.nom)+' <b>'+E(l.num)+'</b> '+delBtn('lin',l.id)+'</span>'}).join(''):'<span class="mut" style="border:0;background:none;padding:0">Añade los números que atiende este puesto.</span>')+'</div><form class="fm" data-form="lin"><div><label for="l_nom">Nombre de la línea</label><input id="l_nom" name="nom" required placeholder="Tienda, Postventa…"></div><div><label for="l_num">Número</label><input id="l_num" name="num" required inputmode="tel"></div><div><button type="submit">Añadir línea</button></div><div class="msg">'+E(P.msg.lin||'')+'</div></form>'+
'<div class="kp"><div><b class="'+(pe.length?'ko':'')+'">'+pe.length+'</b><span>Mensajes sin responder</span></div>'+L.map(function(l){return'<div><b>'+pe.filter(function(w){return w.lin===l.nom}).length+'</b><span>Pendientes · '+E(l.nom)+'</span></div>'}).join('')+'</div>'+
'<h2>Registrar mensaje entrante</h2><form class="fm" data-form="wa"><div><label for="w_lin">Línea</label><select id="w_lin" name="lin">'+(L.length?opts(L.map(function(l){return l.nom}),''):'<option value="">Sin líneas</option>')+'</select></div><div><label for="w_cli">Cliente</label><input id="w_cli" name="cli"></div><div><label for="w_tel">Teléfono del cliente</label><input id="w_tel" name="tel" inputmode="tel" required></div><div class="w2"><label for="w_msg">Mensaje o motivo</label><input id="w_msg" name="msg"></div><div><label for="w_asg">Asignado a</label><input id="w_asg" name="asg"></div><div><button class="p" type="submit">Registrar</button></div><div class="msg">'+E(P.msg.wa||'')+'</div></form>'+
(W.length?'<div class="tw"><table><tr><th>Recibido</th><th>Línea</th><th>Cliente</th><th>Mensaje</th><th>Asignado</th><th>Responder</th><th>Estado</th><th></th></tr>'+W.slice().sort(function(a,b){return(a.est==='Respondido')-(b.est==='Respondido')||(a.ts||0)-(b.ts||0)}).map(function(w){var hh=Math.floor((Date.now()-(w.ts||0))/36e5),hr=waHref(w,1);
return'<tr><td>'+new Date(w.ts||0).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})+(w.est!=='Respondido'?'<br><span class="'+(hh>=24?'ko':hh>=4?'wa':'mu')+'">hace '+hh+' h</span>':'')+'</td><td>'+E(w.lin)+'</td><td>'+E(w.cli)+'<br><span class="mut" style="font-family:var(--f-m)">'+E(w.tel)+'</span></td><td>'+E(w.msg)+'</td><td>'+E(w.asg||'')+'</td><td>'+(hr?'<select class="sm" data-tpl="'+w.id+'" aria-label="Plantilla">'+TPL.map(function(p,i){return'<option value="'+i+'"'+(i===1?' selected':'')+'>'+p[0]+'</option>'}).join('')+'</select><br><a class="wl" id="wl_'+w.id+'" data-wa="'+w.id+'" href="'+E(hr)+'" target="_blank" rel="noopener">Abrir WhatsApp ↗</a>':'<span class="mut">Sin teléfono</span>')+'</td><td><select class="sm" data-st="wa" data-id="'+w.id+'" aria-label="Estado">'+opts(['Pendiente','En gestión','Respondido'],w.est)+'</select></td><td>'+delBtn('wa',w.id)+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Sin mensajes registrados.</div>')+
'<p class="mut">«Abrir WhatsApp» abre la conversación con el texto preparado en el WhatsApp con sesión iniciada en ese equipo o móvil. Para contestar desde una línea concreta, usa el dispositivo o el WhatsApp Web de esa línea.</p>'}

/* ---------- MARCO ---------- */
function draw(){var A=alertas(),t=tab(),app=document.getElementById('app'),a=document.activeElement;
document.getElementById('nav').innerHTML=TABS.map(function(x){return'<a href="#'+x[0]+'" class="'+(x[0]===t?'on':'')+'">'+x[1]+(x[0]==='gerencia'&&A.length?'<i>'+A.length+'</i>':'')+'</a>'}).join('');
var s=document.getElementById('sync');if(P.sync&&P.sync.ts){var age=(Date.now()-new Date(P.sync.ts))/36e5;s.className='sy'+(age>3?' old':'');s.innerHTML='<b></b>Instalaciones actualizadas '+new Date(P.sync.ts).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})}else s.innerHTML='<b style="background:var(--o)"></b>Instalaciones pendientes de sincronizar';
var keep={};app.querySelectorAll('form input,form select').forEach(function(el){if(el.id)keep[el.id]=el.value});var fid=a&&a.id;
app.innerHTML=t==='gerencia'?'<h2>Alertas de lo no ejecutado <span>'+A.length+' abierta(s)</span></h2>'+alHtml(A)+instSemana(0)+instSemana(1)+ventas():t==='administracion'?adm():t==='instalaciones'?ins():wa();
Object.keys(keep).forEach(function(k){var el=document.getElementById(k);if(el&&el.closest('form'))el.value=keep[k]});if(fid){var f=document.getElementById(fid);if(f)f.focus()}}

document.addEventListener('submit',function(e){var f=e.target,c=f.dataset.form;if(!c)return;e.preventDefault();var d={};new FormData(f).forEach(function(v,k){d[k]=String(v).trim()});
var need={ven:['cli','imp'],fact:['prov','imp'],rec:['prov'],lin:['nom','num'],wa:['tel']}[c]||[];var miss=need.filter(function(k){return!d[k]});
if(miss.length){P.msg[c]='Completa: '+miss.map(function(k){return f.querySelector('[name="'+k+'"]').closest('div').querySelector('label').textContent}).join(', ');draw();return}P.msg[c]='';
d.id=U();if(c==='ven'){d.imp=N(d.imp);d.est='Abierto'}if(c==='fact'){d.imp=N(d.imp);d.est='Pendiente'}if(c==='wa'){d.est='Pendiente';d.ts=Date.now()}
f.querySelectorAll('input:not([type=date])').forEach(function(i){i.value=''});put(c,d)});
document.addEventListener('change',function(e){var el=e.target;
if(el.dataset.st){var c=el.dataset.st,x=P.d[c].find(function(y){return y.id===el.dataset.id});if(x){x.est=el.value;if(c==='ven')x.fCierre=el.value==='Abierto'?'':hoy();put(c,x)}}
else if(el.dataset.tpl){var w=P.d.wa.find(function(y){return y.id===el.dataset.tpl}),l=document.getElementById('wl_'+el.dataset.tpl);if(w&&l)l.href=waHref(w,+el.value)}});
document.addEventListener('click',function(e){var b=e.target.closest('[data-act],[data-wa]');if(!b)return;
if(b.dataset.wa){var w=P.d.wa.find(function(y){return y.id===b.dataset.wa});if(w&&w.est==='Pendiente'){w.est='En gestión';setTimeout(function(){put('wa',w)},300)}return}
if(b.dataset.act==='ok'){var cf=Object.assign({},conf(b.dataset.o));cf.id=b.dataset.o;cf[b.dataset.k]=hoy();put('conf',cf)}
else if(b.dataset.act==='del'){var k=b.dataset.c+b.dataset.id;if(P.arm[k]){delete P.arm[k];del(b.dataset.c,b.dataset.id)}else{P.arm[k]=1;draw();setTimeout(function(){if(P.arm[k]){delete P.arm[k];draw()}},4000)}}});
window.addEventListener('hashchange',function(){draw();window.scrollTo(0,0)});
draw();setInterval(function(){var a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;draw()},60000);

(async function(){try{var c=window.claude?await claude.use('db'):null;if(!c){note('Sin conexión a la nube: los datos se guardan solo en este dispositivo.');return}P.db=c;
var tm=setTimeout(function(){note('La nube tarda en responder; se muestran los datos de este dispositivo.')},10000);
c.doc('sync/obras').onSnapshot(function(d){clearTimeout(tm);if(d.exists){P.sync=JSON.parse(JSON.stringify(d.data()))}draw()},function(){clearTimeout(tm)});
COLS.forEach(function(k){c.collection(k).onSnapshot(function(s){clearTimeout(tm);var m=s.docs.map(function(d){return JSON.parse(JSON.stringify(d.data()))});
if(!m.length&&P.d[k].length&&!(s.metadata&&s.metadata.fromCache)){P.d[k].forEach(function(o){c.doc(k+'/'+o.id).set(o).catch(function(){})});return}
P.d[k]=m;lsPut();var a=document.activeElement;if(!(a&&/INPUT|SELECT/.test(a.tagName)&&a.closest('form')))draw()},function(){})})}catch(e){}})();
})();
</script>
